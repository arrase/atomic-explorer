[package]
name = "atomic-math"
version = "0.1.0"
edition = "2021"
description = "Pure math engine for atomic orbital wavefunctions — compiles to both native and WASM"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
js-sys = "0.3"

[dev-dependencies]
approx = "0.5"
